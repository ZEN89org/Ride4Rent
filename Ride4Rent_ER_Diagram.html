<!DOCTYPE html>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #FFFFFF;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
      overflow-x: auto;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 3000px;
      margin: 0 auto 16px auto;
      padding-bottom: 12px;
      border-bottom: 2px solid #000000;
    }
    .title-area h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #000000;
    }
    .title-area p {
      font-size: 13px;
      color: #000000;
      margin-top: 4px;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      background-color: #FFFFFF;
      color: #000000;
      border: 1.5px solid #000000;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.15s ease;
    }
    .btn:hover {
      background-color: #F0F0F0;
    }
    .canvas-container {
      max-width: 3000px;
      margin: 0 auto;
      background: #FFFFFF;
    }
    svg text {
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

</head>

  <!-- Download Scripts -->
  <script>
    function getSvgBlob() {
      const svgElement = document.getElementById("erd-svg");
      const serializer = new XMLSerializer();
      let source = serializer.serializeToString(svgElement);

      if (!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
        source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
      }
      if (!source.match(/^<svg[^>]+xmlns\:xlink="http\:\/\/www\.w3\.org\/1999\/xlink"/)) {
        source = source.replace(/^<svg/, '<svg xmlns:xlink="http://www.w3.org/1999/xlink"');
      }
      return new Blob([source], { type: "image/svg+xml;charset=utf-8" });
    }

    function downloadSVG() {
      const blob = getSvgBlob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "ride4rent_er_diagram.svg";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function downloadImage(format) {
      const svgElement = document.getElementById("erd-svg");
      const width = parseInt(svgElement.getAttribute("width"));
      const height = parseInt(svgElement.getAttribute("height"));

      const blob = getSvgBlob();
      const url = URL.createObjectURL(blob);
      const img = new Image();

      img.onload = function() {
        const canvas = document.createElement("canvas");
        const scale = 1.5;
        canvas.width = width * scale;
        canvas.height = height * scale;

        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.scale(scale, scale);
        ctx.drawImage(img, 0, 0);

        URL.revokeObjectURL(url);

        const mime = format === "jpeg" ? "image/jpeg" : "image/png";
        const filename = format === "jpeg" ? "ride4rent_er_diagram.jpg" : "ride4rent_er_diagram.png";

        const imageURI = canvas.toDataURL(mime, 0.95);
        const link = document.createElement("a");
        link.download = filename;
        link.href = imageURI;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      img.src = url;
    }
  </script>
</body>
